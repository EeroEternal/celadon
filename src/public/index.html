<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>celadon</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --border: #e5e7f0; --text: #171a2b; --muted: #6b7280;
    --primary: #4f46e5; --primary-fg: #ffffff; --primary-soft: #eef2ff;
    --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
    --radius: 12px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; }
  a { color: var(--primary); }

  /* ---------- auth ---------- */
  .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); padding: 32px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--primary); flex: none; }
  .auth-card h1 { font-size: 20px; margin: 22px 0 4px; }
  .auth-card p.sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }

  /* ---------- forms ---------- */
  label.field { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: #374151; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .hint a { color: var(--primary); text-decoration: underline; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--text); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  textarea { resize: vertical; min-height: 84px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px;
    border-radius: 10px; border: 1px solid transparent; font-weight: 600; transition: opacity .15s, background .15s; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: var(--primary-fg); }
  .btn-primary:hover:not(:disabled) { background: #4338ca; }
  .btn-ghost { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-ghost:hover:not(:disabled) { background: var(--bg); }
  .btn-danger { background: #fff; border-color: #fecaca; color: var(--danger); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 7px 12px; font-size: 13.5px; }
  .icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 10px; font-size: 18px; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 232px 1fr; height: 100vh; height: 100dvh; overflow: hidden; }
  .sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 18px 14px;
    display: flex; flex-direction: column; gap: 6px; height: 100%; min-height: 0; }
  .sidebar .brand { padding: 6px 10px 18px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    color: #4b5563; font-weight: 500; border: 0; background: transparent; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--bg); }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .sidebar .spacer { flex: 1; min-height: 8px; }
  .sessions-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 4px; }
  .sessions-head b { font-size: 12px; color: var(--muted); font-weight: 600; }
  .inherit-row { padding: 0 10px 8px; }
  .inherit-row select { padding: 6px 8px; font-size: 12px; border-radius: 8px; }
  .session-list { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
  .session-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .session-item:hover { background: var(--bg); }
  .session-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .session-item .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .session-item .del { border: 0; background: transparent; color: var(--muted); border-radius: 6px; padding: 4px 6px;
    line-height: 0; visibility: hidden; display: flex; align-items: center; }
  .session-item:hover .del { visibility: visible; }
  .session-item .del:hover { color: var(--danger); background: #fee2e2; }
  .user-box { border-top: 1px solid var(--border); padding-top: 12px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-soft); color: var(--primary);
    display: grid; place-items: center; font-weight: 700; flex: none; }
  .user-box .who { flex: 1; min-width: 0; }
  .user-box .who b { display: block; font-size: 13.5px; }
  .user-box .out { border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 6px;
    line-height: 0; display: flex; align-items: center; flex: none; }
  .user-box .out:hover { color: var(--danger); background: #fee2e2; }
  .user-box .who span { color: var(--muted); font-size: 12px; }

  main { min-width: 0; display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .page-header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--panel);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .page-header h1 { font-size: 16.5px; margin: 0; }
  .page-header .sub { color: var(--muted); font-size: 12.5px; }
  .page-header .grow { flex: 1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .badge.ok { background: #ecfdf5; color: var(--ok); border-color: #a7f3d0; }
  .badge.warn { background: #fffbeb; color: var(--warn); border-color: #fde68a; }

  /* ---------- chat ---------- */
  .chat-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .messages { flex: 1; overflow-y: auto; min-height: 0; padding: 26px 24px 12px; }
  .msg-row { display: flex; margin: 0 auto 14px; max-width: 860px; }
  .msg-row.user { flex-direction: row-reverse; }
  .bubble { max-width: 82%; padding: 11px 15px; border-radius: 16px; background: var(--panel);
    border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(16,24,40,.05); overflow-wrap: anywhere; }
  .msg-row.user .bubble { background: var(--primary); color: #fff; border-color: var(--primary); }
  .time-divider { text-align: center; color: var(--muted); font-size: 11.5px; margin: 18px 0 12px; }
  .bubble pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 13px; }
  .bubble code { background: rgba(107,114,128,.12); padding: 1px 6px; border-radius: 6px; font-size: 13px; }
  .bubble pre code { background: transparent; padding: 0; }
  .bubble ul { padding-left: 20px; margin: 6px 0; }
  .bubble p { margin: 6px 0; }
  .msg-row.user .bubble code { background: rgba(255,255,255,.2); }
  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  .composer { border-top: 1px solid var(--border); background: var(--panel); padding: 14px 24px 18px; flex: none; }
  .composer .inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { min-height: 48px; max-height: 180px; flex: 1; }

  /* ---------- settings ---------- */
  .settings-body { padding: 24px; max-width: 860px; width: 100%; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px; margin-bottom: 18px; }
  .card h2 { font-size: 15.5px; margin: 0 0 4px; }
  .card .desc { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .row { display: flex; gap: 16px; }
  .row > * { flex: 1; min-width: 0; }
  .switch-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; flex-wrap: wrap; }
  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
  .switch .track { position: absolute; inset: 0; background: #d1d5db; border-radius: 999px; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .setting-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .card h2 + .setting-row { border-top: 0; padding-top: 4px; }
  .setting-row .who { flex: 1; min-width: 0; }
  .setting-row .who b { display: block; font-size: 13.5px; }
  .setting-row .who b.key { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .setting-row .who span { color: var(--muted); font-size: 12px; }
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 60; display: flex;
    align-items: center; justify-content: center; padding: 16px; }
  .modal-card { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow);
    width: 100%; max-width: 420px; padding: 20px; }
  .modal-card h3 { margin: 0 0 10px; font-size: 15px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  /* ---------- toast ---------- */
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 99; display: flex;
    flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast-item { background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px;
    box-shadow: var(--shadow); opacity: .96; }

  /* ---------- hamburger / drawer ---------- */
  .hamburger { display: none; }
  .bars { position: relative; width: 18px; height: 2px; background: currentColor; border-radius: 2px; }
  .bars::before, .bars::after { content: ""; position: absolute; left: 0; width: 18px; height: 2px;
    background: currentColor; border-radius: 2px; }
  .bars::before { top: -6px; } .bars::after { top: 6px; }
  .drawer-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 30; }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) {
    .shell { grid-template-columns: 1fr; }
    .hamburger { display: inline-flex; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 250px; z-index: 40; height: 100dvh;
      transform: translateX(-105%); transition: transform .2s ease; }
    .sidebar.open { transform: none; box-shadow: var(--shadow); }
    .messages { padding: 18px 14px 8px; }
    .composer { padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); }
    .bubble { max-width: 86%; }
    .page-header { padding: 10px 14px; }
    .settings-body { padding: 16px; }
    .row { flex-direction: column; }
  }
  @media (max-width: 480px) {
    .auth-card { padding: 24px; }
  }
</style>
</head>
<body>
<div id="toast"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<!-- ================= login ================= -->
<div id="loginView" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="brand"><div class="logo"></div> celadon</div>
    <h1>登录</h1>
    <p class="sub">AI 助手</p>
    <p class="hint">外部应用 / 开发者：<a href="/llms.txt" target="_blank" rel="noopener">API 指南（llms.txt）</a></p>
    <form id="loginForm">
      <label class="field">用户名</label>
      <input type="text" id="loginUser" autocomplete="username" value="admin">
      <label class="field">密码</label>
      <input type="password" id="loginPass" autocomplete="current-password">
      <div style="margin-top:20px"><button class="btn btn-primary btn-block" type="submit">登录</button></div>
      <div class="hint" id="loginError" style="color:var(--danger)"></div>
    </form>
  </div>
</div>

<!-- ================= app ================= -->
<div id="appView" class="shell hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo"></div> celadon</div>
    <button class="nav-item" data-page="chat">对话</button>
    <button class="nav-item" data-page="settings">设置</button>
    <div class="sessions-head"><b>会话</b><button class="btn btn-ghost btn-sm" id="newSessionBtn">新会话</button></div>
    <div class="inherit-row">
      <select id="inheritSelect" title="新会话继承的记忆（来自记忆库，由你选择）"></select>
    </div>
    <div class="session-list" id="sessionList"></div>
    <div class="spacer"></div>
    <div class="user-box">
      <div class="avatar">A</div>
      <div class="who"><b>admin</b><span>已登录</span></div>
      <button class="out" id="logoutBtn" title="退出登录" aria-label="退出登录">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
        </svg>
      </button>
    </div>
  </aside>

  <main>
    <!-- chat page -->
    <section id="chatPage" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="page-header">
        <button class="btn btn-ghost icon-btn hamburger menu-toggle" title="菜单"><span class="bars"></span></button>
        <h1>celadon</h1>
        <div class="grow"></div>
        <span class="badge ok" id="chatStatus">● 就绪</span>
      </div>
      <div class="chat-wrap">
        <div class="messages" id="messages"></div>
        <div class="composer">
          <div class="inner">
            <textarea id="chatInput" placeholder="给 celadon 发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
            <button class="btn btn-primary" id="sendBtn">发送</button>
          </div>
        </div>
      </div>
    </section>

    <!-- settings page -->
    <section id="settingsPage" class="hidden" style="flex:1;min-height:0;overflow-y:auto">
      <div class="page-header">
        <button class="btn btn-ghost icon-btn hamburger menu-toggle" title="菜单"><span class="bars"></span></button>
        <h1>设置</h1>
      </div>
      <div class="settings-body">
        <div class="card">
          <h2>目标仓库</h2>
          <div class="setting-row">
            <div class="who"><b id="repoNow">-</b><span>Agent 工作的目标仓库（owner/name）</span></div>
            <button class="btn btn-ghost btn-sm" id="repoEditBtn">更换</button>
          </div>
        </div>

        <div class="card">
          <h2>访问密钥（外部应用）</h2>
          <div class="setting-row">
            <div class="who"><b id="accessKeyState" class="key">-</b><span>外部应用调用 API：<code>Authorization: Bearer …</code>，可随时复制分发</span></div>
            <button class="btn btn-ghost btn-sm" id="copyKeyBtn">复制</button>
            <button class="btn btn-ghost btn-sm" id="accessKeyEditBtn">修改</button>
          </div>
        </div>

        <div class="card">
          <h2>登录口令</h2>
          <div class="setting-row">
            <div class="who"><b id="passState">-</b><span>管理页登录口令（用户 admin）</span></div>
            <button class="btn btn-ghost btn-sm" id="passEditBtn">修改</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
    });
  };

  function toast(text) {
    var box = $("toast");
    var item = document.createElement("div");
    item.className = "toast-item";
    item.textContent = text;
    box.appendChild(item);
    setTimeout(function () { item.remove(); }, 3200);
  }

  async function api(path, opts) {
    opts = opts || {};
    var res = await fetch(path, {
      method: opts.method || "GET",
      headers: { "content-type": "application/json" },
      credentials: "same-origin",
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
    var data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
    return data;
  }

  /* ---------------- auth ---------------- */
  function showLogin() {
    $("appView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
  }
  function showApp() {
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
  }

  $("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("loginError").textContent = "";
    try {
      await api("/api/login", { method: "POST", body: { username: $("loginUser").value.trim(), password: $("loginPass").value } });
      showApp();
      boot();
    } catch (err) {
      $("loginError").textContent = err.message;
    }
  });

  async function logout() {
    try { await api("/api/logout", { method: "POST" }); } catch (e) {}
    showLogin();
  }
  $("logoutBtn").addEventListener("click", logout);

  /* ---------------- router ---------------- */
  function navigate(next) {
    $("chatPage").classList.toggle("hidden", next !== "chat");
    $("settingsPage").classList.toggle("hidden", next !== "settings");
    document.querySelectorAll("[data-page]").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-page") === next);
    });
    if (next === "chat") {
      scrollMessages();
      $("chatInput").focus();
    }
  }
  document.querySelectorAll("[data-page]").forEach(function (b) {
    b.addEventListener("click", function () { navigate(b.getAttribute("data-page")); closeDrawer(); });
  });

  /* ---------------- drawer menu (narrow screens) ---------------- */
  function closeDrawer() {
    document.querySelector(".sidebar").classList.remove("open");
    var bd = document.querySelector(".drawer-backdrop");
    if (bd) bd.remove();
  }
  function toggleDrawer() {
    var sb = document.querySelector(".sidebar");
    if (sb.classList.contains("open")) { closeDrawer(); return; }
    sb.classList.add("open");
    var bd = document.createElement("div");
    bd.className = "drawer-backdrop";
    bd.addEventListener("click", closeDrawer);
    document.body.appendChild(bd);
  }
  document.querySelectorAll(".menu-toggle").forEach(function (b) {
    b.addEventListener("click", toggleDrawer);
  });

  /* ---------------- sessions ---------------- */
  var sessions = [];
  var currentId = localStorage.getItem("celadonSession") || "main";

  function chatUrl(suffix) {
    return "/agents/keeper/" + encodeURIComponent(currentId) + (suffix || "");
  }

  function renderSessions() {
    var box = $("sessionList");
    box.innerHTML = "";
    sessions.forEach(function (s) {
      var item = document.createElement("div");
      item.className = "session-item" + (s.id === currentId ? " active" : "");
      var t = document.createElement("div");
      t.className = "title";
      t.textContent = s.title || s.id;
      item.appendChild(t);
      {
        var del = document.createElement("button");
        del.className = "del";
        del.title = "删除会话";
        del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6l1 14h12l1-14"/>' +
          '<path d="M10 10v6"/><path d="M14 10v6"/></svg>';
        del.addEventListener("click", async function (e) {
          e.stopPropagation();
          try {
            await api("/api/sessions/" + encodeURIComponent(s.id), { method: "DELETE" });
            toast("会话已删除");
            await loadSessions();
            switchSession(currentId);
          } catch (err) { toast(err.message); }
        });
        item.appendChild(del);
      }
      item.addEventListener("click", function () { switchSession(s.id); });
      box.appendChild(item);
    });
  }

  async function loadSessions() {
    try {
      var data = await api("/api/sessions");
      sessions = data.sessions || [];
      if (!sessions.length) sessions = [await api("/api/sessions", { method: "POST" })];
      if (!sessions.some(function (s) { return s.id === currentId; })) currentId = sessions[0].id;
      localStorage.setItem("celadonSession", currentId);
      renderSessions();
      // 记忆库下拉：用户在新建会话时选择继承哪份记忆
      var cfg = await api("/api/config");
      var sel = $("inheritSelect");
      sel.innerHTML = '<option value="">新会话 · 空白记忆</option>';
      Object.keys(cfg.memories || {}).forEach(function (id) {
        if (!(cfg.memories[id] || []).length) return;
        var src = sessions.filter(function (x) { return x.id === id; })[0];
        var o = document.createElement("option");
        o.value = id;
        o.textContent = "新会话 · 继承「" + ((src && src.title) || id) + "」记忆";
        sel.appendChild(o);
      });
      // 记忆库为空时隐藏选择器，避免一个没选项的空框让人困惑
      document.querySelector(".inherit-row").style.display = sel.options.length > 1 ? "" : "none";
    } catch (e) { /* transient */ }
  }

  function switchSession(id) {
    currentId = id;
    localStorage.setItem("celadonSession", id);
    renderSessions();
    messages = [];
    baselineAssistantTs = 0;
    renderMessages();
    loadMessages();
    navigate("chat");
    closeDrawer();
  }

  $("newSessionBtn").addEventListener("click", async function () {
    try {
      var s = await api("/api/sessions", { method: "POST", body: { inheritFrom: $("inheritSelect").value } });
      sessions.unshift(s);
      switchSession(s.id);
      toast("已新建会话");
    } catch (e) { toast(e.message); }
  });

  /* ---------------- chat ---------------- */
  var messages = [];
  var waiting = false;
  var pollTimer = null;
  var baselineAssistantTs = 0;

  function lastAssistantTs() {
    var ts = 0;
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (m.role !== "assistant") continue;
      var parts = m.parts || [];
      for (var j = 0; j < parts.length; j++) {
        if (parts[j].type === "text" && parts[j].text && parts[j].text.trim()) {
          ts = Math.max(ts, Date.parse(m.timestamp) || 0);
        }
      }
    }
    return ts;
  }

  function md(text) {
    var out = esc(text);
    out = out.replace(/```([\s\S]*?)```/g, function (_, code) { return "<pre><code>" + code.replace(/^\n/, "") + "</code></pre>"; });
    out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    out = out.replace(/^### (.+)$/gm, "<b>$1</b>");
    out = out.replace(/^- (.+)$/gm, "<li>$1</li>");
    out = out.replace(/(<li>[\s\S]*?<\/li>)/g, "<ul>$1</ul>");
    out = out.replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>");
    return "<p>" + out + "</p>";
  }

  function fmtTime(ts) {
    try {
      var d = new Date(ts);
      return d.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }

  function renderMessages() {
    var box = $("messages");
    var html = "";
    var shown = 0;
    var prevTs = 0;
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (m.role !== "user" && m.role !== "assistant") continue;
      var text = "";
      for (var j = 0; j < (m.parts || []).length; j++) {
        var p = m.parts[j];
        if (p.type === "text" && p.text) text += (text ? "\n" : "") + p.text;
      }
      if (!text.trim()) continue;
      shown++;
      var ts = Date.parse(m.timestamp) || 0;
      if (!prevTs || ts - prevTs > 5 * 60 * 1000) {
        html += '<div class="time-divider">' + esc(fmtTime(m.timestamp)) + "</div>";
      }
      prevTs = ts;
      var isUser = m.role === "user";
      html += '<div class="msg-row ' + (isUser ? "user" : "assistant") + '">' +
        '<div class="bubble">' + (isUser ? "<p>" + esc(text) + "</p>" : md(text)) + "</div></div>";
    }
    if (waiting) {
      html += '<div class="msg-row assistant"><div class="bubble">' +
        '<div class="typing"><i></i><i></i><i></i></div></div></div>';
    }
    if (!shown && !waiting) {
      html = '<div style="text-align:center;color:var(--muted);padding:48px 16px">' +
        '<p>有什么可以帮忙的？</p>' +
        '<p class="hint">外部应用 / 开发者：<a href="/llms.txt" target="_blank" rel="noopener">API 指南（llms.txt）</a></p></div>';
    }
    box.innerHTML = html;
    scrollMessages();
  }

  function scrollMessages() {
    var box = $("messages");
    box.scrollTop = box.scrollHeight;
  }

  async function loadMessages() {
    try {
      var data = await api(chatUrl("?view=history"));
      messages = data.messages || [];
      waiting = lastAssistantTs() <= baselineAssistantTs;
      renderMessages();
      $("chatStatus").textContent = waiting ? "● 运行中" : "● 就绪";
      $("chatStatus").className = "badge " + (waiting ? "warn" : "ok");
    } catch (e) { /* transient */ }
  }

  async function send(text) {
    if (!text.trim() || waiting) return;
    baselineAssistantTs = lastAssistantTs();
    waiting = true;
    $("chatInput").value = "";
    messages.push({ role: "user", timestamp: new Date().toISOString(), parts: [{ type: "text", text: text }] });
    renderMessages();
    try {
      var payload = { kind: "user", body: text };
      var srec = sessions.filter(function (s) { return s.id === currentId; })[0];
      if (srec && srec.seed && srec.seed.length && !srec.seeded) {
        srec.seeded = true; // initialData 只在实例创建时生效，重复发送无害
        payload.initialData = { memory: srec.seed };
      }
      await api(chatUrl(), { method: "POST", body: payload });
    } catch (e) {
      waiting = false;
      toast("发送失败：" + e.message);
      renderMessages();
      return;
    }
    // 首条消息自动成为会话标题
    var cur = sessions.filter(function (s) { return s.id === currentId; })[0];
    if (cur && cur.title === "新会话") {
      var title = text.replace(/\s+/g, " ").slice(0, 30);
      cur.title = title;
      renderSessions();
      api("/api/sessions/" + encodeURIComponent(currentId), { method: "PATCH", body: { title: title } }).catch(function () {});
    }
    startPolling();
  }

  function startPolling() {
    if (pollTimer) return;
    var tries = 0;
    pollTimer = setInterval(async function () {
      await loadMessages();
      tries++;
      if (!waiting || tries > 60) {
        clearInterval(pollTimer);
        pollTimer = null;
        if (tries > 60) { waiting = false; renderMessages(); }
      }
    }, 3000);
  }

  $("sendBtn").addEventListener("click", function () { send($("chatInput").value); });
  $("chatInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("chatInput").value); }
  });

  /* ---------------- settings（只读展示，编辑走弹窗） ---------------- */
  var currentRepo = "";
  var currentAccessKey = "";
  var modalSaveFn = null;

  function openModal(title, bodyHtml, onSave) {
    $("modalTitle").textContent = title;
    $("modalBody").innerHTML = bodyHtml;
    modalSaveFn = onSave;
    $("modal").classList.remove("hidden");
  }
  function closeModal() {
    $("modal").classList.add("hidden");
    modalSaveFn = null;
  }
  $("modalCancel").addEventListener("click", closeModal);
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
  $("modalSave").addEventListener("click", async function () {
    if (!modalSaveFn) return closeModal();
    try {
      if (await modalSaveFn() !== false) closeModal();
    } catch (e) { toast(e.message); }
  });

  async function loadSettings() {
    try {
      var cfg = await api("/api/config");
      currentRepo = cfg.repo || "";
      $("repoNow").textContent = currentRepo || "（未设置）";
      currentAccessKey = cfg.accessKey || "";
      $("accessKeyState").textContent = currentAccessKey || "未设置（仅认 Worker secret）";
      $("copyKeyBtn").style.display = currentAccessKey ? "" : "none";
      $("passState").textContent = cfg.adminPassSet ? "已修改" : "默认口令（建议尽快修改）";
    } catch (e) { /* transient */ }
  }

  $("repoEditBtn").addEventListener("click", async function () {
    openModal("更换目标仓库",
      '<label class="field">仓库（owner/name）</label>' +
      '<input type="text" id="repoInput" placeholder="EeroEternal/xgateway">' +
      '<div class="hint">celadon 值守的目标仓库。</div>',
      async function () {
        var repo = $("repoInput").value.trim();
        if (!repo) { toast("请填写仓库（owner/name）"); return false; }
        await api("/api/config", { method: "PUT", body: { repo: repo } });
        await loadSettings();
        toast("已切换目标仓库：" + repo);
      });
    $("repoInput").value = currentRepo;
  });

  $("copyKeyBtn").addEventListener("click", async function () {
    try {
      await navigator.clipboard.writeText(currentAccessKey);
      toast("访问密钥已复制");
    } catch (e) { toast("复制失败，请手动选中复制"); }
  });

  $("passEditBtn").addEventListener("click", function () {
    openModal("修改登录口令",
      '<label class="field">新口令</label><input type="password" id="passInput" autocomplete="new-password">' +
      '<label class="field">确认新口令</label><input type="password" id="passInput2" autocomplete="new-password">' +
      '<div class="hint">至少 6 位。修改后下次登录生效，已登录会话不受影响。</div>',
      async function () {
        var p = $("passInput").value, p2 = $("passInput2").value;
        if (p.length < 6) { toast("口令至少 6 位"); return false; }
        if (p !== p2) { toast("两次输入不一致"); return false; }
        await api("/api/config", { method: "PUT", body: { adminPass: p } });
        await loadSettings();
        toast("登录口令已修改");
      });
  });

  $("accessKeyEditBtn").addEventListener("click", function () {
    openModal("修改访问密钥",
      '<label class="field">Bearer 密钥（供外部应用调用 API）</label>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
      '<input type="password" id="accessKeyInput" placeholder="留空保持不变" autocomplete="new-password" style="flex:1">' +
      '<button class="btn btn-ghost btn-sm" id="genKeyBtn">自动生成</button></div>' +
      '<div class="hint">保存后把密钥发给外部应用：<code>Authorization: Bearer 密钥</code>。修改后旧密钥失效（全局只有一个密钥）。</div>',
      async function () {
        var key = $("accessKeyInput").value.trim();
        if (!key) { toast("留空则不修改"); return false; }
        await api("/api/config", { method: "PUT", body: { accessKey: key } });
        await loadSettings();
        toast("访问密钥已保存，可复制给外部应用");
      });
    $("genKeyBtn").addEventListener("click", function () {
      // 浏览器原生 CSPRNG：ck_ + 48 位十六进制
      var bytes = new Uint8Array(24);
      crypto.getRandomValues(bytes);
      var hex = Array.prototype.map.call(bytes, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
      var input = $("accessKeyInput");
      input.value = "ck_" + hex;
      input.type = "text"; // 生成后可见，方便复制给外部应用
    });
  });


  /* ---------------- boot ---------------- */
  async function boot() {
    await loadSessions();
    navigate("chat");
    await Promise.all([loadMessages(), loadSettings()]);
    if (waiting) startPolling();
  }

  api("/api/session")
    .then(function () { showApp(); boot(); })
    .catch(function () { showLogin(); });
})();
</script>
</body>
</html>
